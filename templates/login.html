{% extends "base.html" %}
{% block content %}
<div class="nexus-login-wrap">
    <div class="nexus-card nexus-card--login">
        <div class="nexus-mb-lg">
            <span class="nexus-logo-hex"></span>
        </div>
        <h1 class="nexus-login-title">Nexus Insight</h1>
        <p class="nexus-company-subtitle">{{ company_name }}</p>
        <p class="nexus-text-small nexus-mb-lg">Inicia sesión para continuar</p>
        <form method="post" action="/login" class="nexus-text-left">
            <label for="username">Usuario
                <input type="text" id="username" name="username" placeholder="usuario" required>
            </label>
            <label for="password">Contraseña
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </label>
            <button type="submit" class="nexus-btn nexus-btn-primary nexus-btn-block">Iniciar sesión</button>
        </form>
        {% if error %}
        <div class="nexus-toast nexus-toast-error nexus-toast--static">{{ error }}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
