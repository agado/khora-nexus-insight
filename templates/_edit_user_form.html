<h3>Editar Usuario — {{ edit_user.username }}</h3>

{% if error %}
<div class="nexus-toast nexus-toast-error nexus-toast--static">{{ error }}</div>
{% endif %}

<form hx-post="/web/users/{{ edit_user.id }}/edit" hx-target="#tab-content" hx-swap="innerHTML">
    <label for="username">Usuario
        <input type="text" id="username" name="username" value="{{ edit_user.username }}" required autocomplete="off">
    </label>
    <label for="role">Rol
        <select id="role" name="role" required>
            <option value="staff" {% if edit_user.role == 'staff' %}selected{% endif %}>Staff</option>
            <option value="lead" {% if edit_user.role == 'lead' %}selected{% endif %}>Lead</option>
            <option value="admin" {% if edit_user.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
    </label>
    <label for="department_id">Departamento principal
        <select id="department_id" name="department_id" required>
            {% for dept in departments %}
            <option value="{{ dept.id }}" {% if edit_user.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label for="accessible_depts">Departamentos accesibles
        <select id="accessible_depts" name="accessible_department_ids" multiple size="3">
            {% for dept in departments %}
            <option value="{{ dept.id }}" {% if dept.id in current_accessible_ids %}selected{% endif %}>{{ dept.name }}</option>
            {% endfor %}
        </select>
        <small class="nexus-doc-filter-hint">Mantén Ctrl/Cmd para seleccionar varios.</small>
    </label>
    <div class="nexus-flex nexus-gap-sm nexus-mt-lg">
        <button type="submit" class="nexus-btn nexus-btn-primary">Guardar cambios</button>
        <button type="button" class="nexus-btn nexus-btn-secondary"
                hx-get="/web/users"
                hx-target="#tab-content" hx-swap="innerHTML">
            Cancelar
        </button>
    </div>
</form>
