<h3>Nuevo Usuario</h3>

{% if error %}
<div class="nexus-toast nexus-toast-error nexus-toast--static">{{ error }}</div>
{% endif %}

<form hx-post="/web/users" hx-target="#tab-content" hx-swap="innerHTML">
    <label for="username">Usuario
        <input type="text" id="username" name="username" required autocomplete="off"
               value="{{ form_data.get('username', '') if form_data else '' }}">
    </label>
    <label for="password">Contraseña
        <input type="password" id="password" name="password" required minlength="8"
               oninput="validatePassword()">
        <div class="nexus-pw-checklist" id="pw-checklist">
            <span class="pw-req" id="req-len">✗ 8+ caracteres</span>
            <span class="pw-req" id="req-up">✗ Mayúscula</span>
            <span class="pw-req" id="req-low">✗ Minúscula</span>
            <span class="pw-req" id="req-dig">✗ Dígito</span>
            <span class="pw-req" id="req-sym">✗ Carácter especial</span>
        </div>
    </label>
    <label for="password_confirm">Confirmar contraseña
        <input type="password" id="password_confirm" name="password_confirm" required
               oninput="validatePassword()">
        <small class="nexus-hint nexus-pw-match" id="pw-match"></small>
    </label>
    <label for="role">Rol
        <select id="role" name="role" required>
            <option value="">Seleccionar...</option>
            <option value="staff" {{ 'selected' if form_data and form_data.get('role') == 'staff' else '' }}>Staff</option>
            <option value="lead" {{ 'selected' if form_data and form_data.get('role') == 'lead' else '' }}>Lead</option>
            <option value="admin" {{ 'selected' if form_data and form_data.get('role') == 'admin' else '' }}>Admin</option>
        </select>
    </label>
    <label for="department_id">Departamento principal
        <select id="department_id" name="department_id" required>
            <option value="">Seleccionar...</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}" {{ 'selected' if form_data and form_data.get('department_id')|string == dept.id|string else '' }}>{{ dept.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label for="accessible_depts">Departamentos accesibles
        <select id="accessible_depts" name="accessible_department_ids" multiple size="3">
            {% for dept in departments %}
            <option value="{{ dept.id }}" {{ 'selected' if form_data and dept.id in form_data.get('accessible_department_ids', []) else '' }}>{{ dept.name }}</option>
            {% endfor %}
        </select>
        <small class="nexus-hint">Mantén Ctrl/Cmd para seleccionar varios. Si no seleccionas ninguno, solo podrá acceder a su departamento principal.</small>
    </label>
    <div class="nexus-flex nexus-gap-sm nexus-mt-lg">
        <button type="submit" class="nexus-btn nexus-btn-primary">Crear usuario</button>
        <button type="button" class="nexus-btn nexus-btn-secondary"
                hx-get="/web/users"
                hx-target="#tab-content" hx-swap="innerHTML">
            Cancelar
        </button>
    </div>
</form>
