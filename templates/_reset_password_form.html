<h3>Resetear Contraseña — {{ username }}</h3>

<form hx-post="/web/users/{{ user_id }}/reset-password" hx-target="#tab-content" hx-swap="innerHTML">
    <label for="new_password">Nueva contraseña
        <input type="password" id="new_password" name="new_password" required minlength="4">
    </label>
    <button type="submit" class="nexus-btn nexus-btn-primary">Guardar</button>
    <a href="/web/users" class="nexus-btn nexus-btn-secondary">Cancelar</a>
</form>

{% if error %}
<div class="nexus-toast nexus-toast-error nexus-toast--static">{{ error }}</div>
{% endif %}
