<tr>
    <td><strong>{{ doc.filename }}</strong></td>
    <td><code class="nexus-text-mono">{{ doc.sha256[:16] }}...</code></td>
    <td><span class="nexus-text-small">#{{ doc.department_id }}</span></td>
    <td class="nexus-text-small">{{ doc.created_at.strftime('%Y-%m-%d') if doc.created_at else '' }}</td>
    {% if role_level >= 2 %}
    <td>
        <label class="nexus-toggle" title="Cambiar visibilidad pública">
            <input type="checkbox" {{ 'checked' if doc.is_public else '' }}
                   hx-post="/web/documents/{{ doc.id }}/toggle-public"
                   hx-target="closest tr" hx-swap="outerHTML">
            <span class="nexus-toggle-track"></span>
            {% if doc.is_public %}
            <span class="nexus-badge nexus-badge-green">Público</span>
            {% else %}
            <span class="nexus-badge nexus-badge-gray">Privado</span>
            {% endif %}
        </label>
    </td>
    {% endif %}
    {% if role_level >= 2 %}
    <td class="nexus-text-right">
        <button class="nexus-btn nexus-btn-danger nexus-btn-sm"
                hx-post="/web/documents/{{ doc.id }}/delete"
                hx-confirm="¿Eliminar {{ doc.filename }}?">
            Eliminar
        </button>
    </td>
    {% endif %}
</tr>
