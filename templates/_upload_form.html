<div id="upload-form-area">
    <h3>Subir Documento</h3>
    <form hx-encoding="multipart/form-data" hx-post="/web/upload" hx-target="#upload-form-area" hx-swap="innerHTML">
        <label for="file">Seleccionar archivo PDF
            <input type="file" id="file" name="file" accept=".pdf,application/pdf" required>
        </label>
        <button type="submit">Subir</button>
    </form>
    {% if error %}
    <p style="color: var(--pico-form-element-invalid-border-color);">{{ error }}</p>
    {% endif %}
    {% if success %}
    <p style="color: var(--pico-form-element-valid-border-color);">{{ success }}</p>
    {% endif %}
</div>
