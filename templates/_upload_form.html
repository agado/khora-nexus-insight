<div id="upload-form-area">
    <h3>Subir Documento</h3>
    <form id="upload-form" hx-encoding="multipart/form-data" hx-post="/web/upload" hx-target="#upload-form-area" hx-swap="innerHTML" hx-indicator="#upload-form">
        <label for="file">Archivo PDF
            <input type="file" id="file" name="file" accept=".pdf,application/pdf" required>
        </label>
        <label class="nexus-toggle nexus-mb-md">
            <input type="checkbox" name="is_public" value="true">
            <span class="nexus-toggle-track"></span>
            Marcar como público (visible para todos los departamentos)
        </label>
        <button type="submit" class="nexus-btn nexus-btn-primary">Subir</button>
    </form>
    {% if error %}
    <div class="nexus-toast nexus-toast-error nexus-toast--static">
        {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="nexus-toast nexus-toast-success nexus-toast--static">
        {{ success }}
    </div>
    {% endif %}
</div>
