<div id="upload-form-area">
    <h3>Subir Documento</h3>
    <form hx-encoding="multipart/form-data" hx-post="/web/upload" hx-target="#upload-form-area" hx-swap="innerHTML">
        <label for="file">Archivo PDF
            <input type="file" id="file" name="file" accept=".pdf,application/pdf" required>
        </label>
        <label class="nexus-toggle" style="margin-bottom:1rem">
            <input type="checkbox" name="is_public" value="true">
            <span class="nexus-toggle-track"></span>
            Marcar como público (visible para todos los departamentos)
        </label>
        <button type="submit" class="nexus-btn nexus-btn-primary" aria-busy="false">Subir</button>
    </form>
    {% if error %}
    <div class="nexus-toast nexus-toast-error" style="margin-top:1rem;animation:none">
        {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="nexus-toast nexus-toast-success" style="margin-top:1rem;animation:none">
        {{ success }}
    </div>
    {% endif %}
</div>
