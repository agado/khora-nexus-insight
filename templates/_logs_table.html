<table>
    <thead>
        <tr>
            <th>Acción</th>
            <th>Usuario</th>
            <th>Fecha</th>
            <th>Detalle</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.action }}</td>
            <td>{{ log.username }}</td>
            <td>{{ log.timestamp[:19] }}</td>
            <td>
                {% if log.metadata %}
                <details>
                    <summary>Ver detalle</summary>
                    <pre>{{ log.metadata | tojson(indent=2) }}</pre>
                </details>
                {% endif %}
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No hay registros de actividad.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
