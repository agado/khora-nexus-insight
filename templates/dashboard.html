{% extends "base.html" %}
{% block content %}
<nav>
    <ul><li><strong>Nexus Insight</strong></li></ul>
    <ul>
        <li>
            <details class="dropdown">
                <summary>{{ username }}</summary>
                <ul>
                    <li><a href="/logout">Cerrar sesión</a></li>
                </ul>
            </details>
        </li>
    </ul>
</nav>
<hr>
<div role="tablist" hx-target="#tab-content">
    <button role="tab" hx-get="/web/upload" hx-trigger="click" class="outline">Subir</button>
    <button role="tab" hx-get="/web/documents" hx-trigger="click" class="outline">Documentos</button>
    <button role="tab" hx-get="/web/query" hx-trigger="click" class="outline">Consultar</button>
    <button role="tab" hx-get="/web/logs" hx-trigger="click" class="outline">Registros</button>
</div>
<hr>
<div id="tab-content">
    <p>Seleccione una pestaña para comenzar.</p>
</div>
{% endblock %}
