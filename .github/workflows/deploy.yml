name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "→ Pulling latest code..."
            git pull origin main
            echo "→ Rebuilding and restarting..."
            docker compose -f docker-compose.prod.yml up -d --build
            SERVER_NAME=$(grep -E '^SERVER_NAME=' .env | cut -d'=' -f2-)
            BASE_URL="https://${SERVER_NAME}/api/v1/health"
            echo "→ Smoke test (perímetro real Caddy + TLS): ${BASE_URL}"
            for i in $(seq 1 12); do
              curl -kfsS "${BASE_URL}" > /dev/null 2>&1 && break
              echo "  (intento $i/12) esperando a que Caddy emita el certificado..."
              sleep 5
            done
            curl -kfsS "${BASE_URL}" > /dev/null 2>&1 || {
              echo "⚠️  Smoke test failed. Check logs: docker compose -f docker-compose.prod.yml logs"
              exit 1
            }
            echo "→ Verificando emisión del certificado TLS (Let's Encrypt)..."
            for i in $(seq 1 12); do
              curl -fsS "${BASE_URL}" > /dev/null 2>&1 && break
              echo "  (esperando certificado: intento $i/12)"
              sleep 5
            done
            curl -fsS "${BASE_URL}" > /dev/null 2>&1 || {
              echo "⚠️  El servicio responde pero el certificado no es válido."
              echo "   Comprueba SERVER_NAME (resolución DNS) y puertos 80/443 abiertos."
            }
            echo "✅ Deploy successful (${BASE_URL})"
